apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-worker
  namespace: backend-class
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: backend-class
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      serviceAccountName: backend-worker
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: REPLACE_WITH_STUDENT_WORKER_IMAGE
          envFrom:
            - secretRef:
                name: worker-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
